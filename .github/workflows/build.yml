name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare pinned inference source
        run: .\scripts\prepare-zenz.ps1 -SkipModel
      - name: Build and test x64 and x86
        run: .\scripts\build.ps1 -Configuration Release
      - name: Preserve failed AppContainer diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: appcontainer-failure-diagnostics
          path: |
            out/build/**/container-test-*/startup*.log
            out/build/**/container-test-*/startup.jsonl
            out/build/**/container-test-*/diagnostics/*.jsonl
            out/build/**/container-test-*/saved-diagnostics/*.jsonl
          if-no-files-found: ignore
          retention-days: 7
      - name: Package and validate release version
        run: |
          $package = .\scripts\package.ps1
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne ('v' + $package.Version)) {
            throw "Tag does not match the built version $($package.Version)."
          }
          .\scripts\package.ps1 -Verify $package.Path
      - name: Upload package and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64-package
          path: |
            out/packages/nskkzime-v*-windows-x64.zip
            out/packages/nskkzime-v*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download validated package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-x64-package
          path: release-files
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Development-stage Windows x64 SKK-style IME with a CPU zenz server and x86 companion DLL.

          Install and update require administrator approval by the same user. PowerShell 7 and both x64 and x86 Visual C++ v14 Redistributables are required. Model and SKK dictionary files are downloaded and configured separately. See the packaged README for installation, recovery, and complete removal.

          Binaries are unsigned. SHA-256 checksums are provided beside the ZIP. Automated tests run on Windows; tests requiring the separate inference model are skipped in CI. Clean-machine interactive installation must be checked separately.
          NOTES
          gh release create "$RELEASE_TAG" release-files/*.zip release-files/*.zip.sha256 \
            --verify-tag --title "nskkzime $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
