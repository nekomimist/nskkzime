<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nskkzime native IME compatibility</title>
<style>
  body { font: 18px/1.5 system-ui, sans-serif; max-width: 960px; margin: 24px auto; padding: 0 20px; }
  label { display: block; font-weight: bold; margin-top: 14px; }
  input, textarea, [contenteditable] { font: 22px/1.6 system-ui, sans-serif; width: 100%; box-sizing: border-box; border: 1px solid #778; padding: 8px; }
  textarea, [contenteditable] { min-height: 72px; }
  pre { white-space: pre-wrap; font-size: 13px; max-height: 160px; overflow: auto; background: #eef1f5; padding: 10px; }
</style>
<h1>nskkzime ブラウザ入力検証</h1>
<p>このローカルページは送信・保存を行いません。各入力欄の変換、確定、取消、フォーカス移動を検証します。</p>
<label for="plain">単一行テキスト</label><input id="plain" type="text" autocomplete="off">
<label for="multiline">複数行テキスト</label><textarea id="multiline" spellcheck="false"></textarea>
<label id="editable-label">contenteditable</label><div id="editable" contenteditable="true" role="textbox" aria-multiline="true" aria-labelledby="editable-label" spellcheck="false"></div>
<label for="readonly">読取専用</label><input id="readonly" readonly value="変更しない固定テキスト">
<label for="password">パスワード（検証用の架空文字列のみ）</label><input id="password" type="password" autocomplete="off">
<h2>直近のイベント</h2><pre id="events" aria-live="off">入力待ち</pre>
<script>
  const log = [];
  for (const id of ['plain', 'multiline', 'editable', 'readonly', 'password']) {
    const field = document.getElementById(id);
    for (const type of ['focus', 'blur', 'compositionstart', 'compositionupdate', 'compositionend', 'input']) {
      field.addEventListener(type, event => {
        // Only metadata, never the typed text or password content.
        const suffix = event.inputType ? ` ${event.inputType}` : '';
        log.push(`${id}: ${type}${suffix}`);
        if (log.length > 24) log.shift();
        document.getElementById('events').textContent = log.join('\n');
      });
    }
  }
</script>
</html>
